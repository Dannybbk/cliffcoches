<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin | CliffCoches.Net</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #D4AF37; --black: #0A0A0A; --dark: #141414; --white: #fff; --gray: #888; --red: #ff4d4d; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--black); color: var(--white); padding: 15px; }
    .container { max-width: 800px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; background: var(--dark); padding: 15px 20px; border-radius: 10px; border: 1px solid #222; margin-bottom: 20px; }
    h1 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.5rem; }
    .btn-secondary { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 8px 14px; border-radius: 6px; text-decoration: none; font-weight: 600; }
    .btn-danger { background: rgba(255,77,77,0.1); border: 1px solid var(--red); color: var(--red); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .card { background: var(--dark); padding: 20px; border-radius: 10px; border: 1px solid #222; margin-bottom: 20px; }
    input, textarea, select { width: 100%; padding: 11px; background: #1c1c1c; border: 1px solid #333; color: white; border-radius: 6px; margin: 6px 0; }
    .btn-primary { width: 100%; background: var(--gold); color: black; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 700; margin-top: 10px; }
    .car-item { background: var(--dark); padding: 15px; border-radius: 8px; border: 1px solid #222; margin: 8px 0; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Panel Admin</h1>
      <div>
        <a href="index.html" class="btn-secondary">Ver Web</a>
        <button onclick="logout()" class="btn-danger">Cerrar sesión</button>
      </div>
    </header>

    <div class="card">
      <h2>Añadir Vehículo</h2>
      <input id="title" placeholder="Título opcional">
      <input id="brand" placeholder="Marca">
      <input id="model" placeholder="Modelo">
      <input id="year" type="number" placeholder="Año">
      <input id="price" type="number" placeholder="Precio">
      <input id="km" type="number" placeholder="Kilómetros">
      <select id="fuel">
        <option>Diésel</option>
        <option>Gasolina</option>
        <option>Híbrido</option>
        <option>Eléctrico</option>
      </select>
      <select id="transmission">
        <option>Automático</option>
        <option>Manual</option>
      </select>
      <textarea id="description" placeholder="Descripción" rows="2"></textarea>
      <input type="file" id="photo" accept="image/*">
      <button class="btn-primary" onclick="addCar()">Publicar</button>
    </div>

    <h2 style="color:var(--gold);margin-bottom:10px;">Vehículos Publicados</h2>
    <div id="cars"></div>
  </div>

  <script>
    const sb = window.supabase.createClient(
      'https://axeolovhcpqcubkachez.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4ZW9sb3ZoY3BxY3Via2FjaGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1OTQ2OTcsImV4cCI6MjExMDE3MDY5N30.ejphVuLjV64Pf84UZ1GB0vdwC98oyWQG2mhiNXo18Yw',
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    async function init() {
      const { data } = await sb.auth.getSession();
      if (!data.session) location.href = 'panel-control.html';
      else loadCars();
    }

    async function loadCars() {
      const { data } = await sb.from('vehicles').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('cars');
      if (!data || !data.length) {
        container.innerHTML = '<p style="color:#888;text-align:center;">No hay coches.</p>';
        return;
      }
      container.innerHTML = data.map(c => `
        <div class="car-item">
          <div><b>${c.brand} ${c.model}</b><br><small>${c.year||''} • ${c.price||''}€</small></div>
          <button class="btn-danger" onclick="del('${c.id}')">Borrar</button>
        </div>
      `).join('');
    }

    async function addCar() {
      const brand = document.getElementById('brand').value.trim();
      const model = document.getElementById('model').value.trim();
      const price = document.getElementById('price').value;
      if (!brand || !model || !price) return alert('Marca, modelo y precio son obligatorios');

      let image = null;
      const file = document.getElementById('photo').files[0];
      if (file) {
        const name = Date.now() + '_' + file.name.replace(/[^a-z0-9.]/gi, '_');
        const { error } = await sb.storage.from('Vehicles').upload(name, file);
        if (error) return alert('Error foto: ' + error.message);
        image = sb.storage.from('Vehicles').getPublicUrl(name).data.publicUrl;
      }

      const { error } = await sb.from('vehicles').insert({
        title: document.getElementById('title').value.trim() || brand + ' ' + model,
        brand, model,
        year: parseInt(document.getElementById('year').value) || null,
        price: parseFloat(price),
        mileage: parseInt(document.getElementById('km').value) || null,
        fuel: document.getElementById('fuel').value,
        transmission: document.getElementById('transmission').value,
        description: document.getElementById('description').value.trim(),
        main_image: image,
        status: 'available'
      });

      if (error) alert('Error: ' + error.message);
      else {
        alert('¡Publicado!');
        document.querySelectorAll('input').forEach(i => i.value = '');
        loadCars();
      }
    }

    async function del(id) {
      if (confirm('¿Borrar?')) {
        await sb.from('vehicles').delete().eq('id', id);
        loadCars();
      }
    }

    async function logout() {
      await sb.auth.signOut();
      location.href = 'panel-control.html';
    }

    init();
  </script>
</body>
</html>
