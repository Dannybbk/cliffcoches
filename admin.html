<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin | CliffCoches.Net</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #D4AF37; --black: #0A0A0A; --dark: #141414; --white: #fff; --gray: #888; --red: #ff4d4d; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--black); color: var(--white); padding: 20px; }
    .container { max-width: 960px; margin: 0 auto; }
    
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: var(--dark); 
      padding: 16px 24px; 
      border-radius: 12px; 
      border: 1px solid #222; 
      margin-bottom: 24px; 
      gap: 15px;
      flex-wrap: wrap;
    }
    h1 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.6rem; }
    
    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-secondary { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; justify-content: center; }
    .btn-danger { background: rgba(255,77,77,0.1); border: 1px solid var(--red); color: var(--red); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; justify-content: center; }
    
    .card { background: var(--dark); padding: 24px; border-radius: 12px; border: 1px solid #222; margin-bottom: 24px; }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-full { grid-column: 1 / -1; }
    
    input, textarea, select { width: 100%; padding: 12px 14px; background: #1c1c1c; border: 1px solid #333; color: white; border-radius: 6px; font-size: 0.95rem; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--gold); }
    
    .btn-primary { width: 100%; background: var(--gold); color: black; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 700; margin-top: 12px; }
    
    .car-item { background: var(--dark); padding: 16px; border-radius: 10px; border: 1px solid #222; margin: 10px 0; }
    .car-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .status { font-size: 0.75rem; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
    .status.available { background: #00c86422; color: #00c864; }
    .status.reserved { background: #ffa50022; color: #ffa500; }
    .status.sold { background: #ff4d4d22; color: #ff4d4d; }
    .car-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .car-actions button { padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    .btn-edit { background: rgba(212,175,55,0.15); border: 1px solid var(--gold); color: var(--gold); }
    .btn-reserve { background: rgba(255,165,0,0.15); border: 1px solid #ffa500; color: #ffa500; }
    .btn-sold { background: rgba(255,77,77,0.15); border: 1px solid #ff4d4d; color: #ff4d4d; }
    .btn-del { background: rgba(255,77,77,0.1); border: 1px solid #ff4d4d; color: #ff4d4d; }
    
    @media (max-width: 700px) { 
      .form-grid { grid-template-columns: 1fr; } 
      .form-full { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Panel Admin</h1>
      <div class="header-actions">
        <a href="index.html" class="btn-secondary">Ver Web</a>
        <button onclick="logout()" class="btn-danger">Cerrar sesión</button>
      </div>
    </header>

    <div class="card">
      <h2 id="formTitle" style="margin-bottom:16px;font-family:'Playfair Display',serif;color:var(--gold);">Añadir Vehículo</h2>
      <div class="form-grid">
        <input class="form-full" id="title" placeholder="Título opcional">
        
        <select id="brand">
          <option value="">Selecciona Marca...</option>
          <option>Abarth</option><option>Alfa Romeo</option><option>Audi</option><option>BMW</option>
          <option>Citroën</option><option>Cupra</option><option>Dacia</option><option>Fiat</option>
          <option>Ford</option><option>Honda</option><option>Hyundai</option><option>Jeep</option>
          <option>Kia</option><option>Land Rover</option><option>Mazda</option><option>Mercedes-Benz</option>
          <option>MINI</option><option>Nissan</option><option>Opel</option><option>Peugeot</option>
          <option>Renault</option><option>Seat</option><option>Skoda</option><option>Tesla</option>
          <option>Toyota</option><option>Volkswagen</option><option>Volvo</option><option>Otro</option>
        </select>
        
        <input id="model" placeholder="Modelo">
        <input id="year" type="number" placeholder="Año">
        <input id="price" type="number" placeholder="Precio (ej: 49500)">
        <input id="km" type="number" placeholder="Kilómetros">
        
        <select id="fuel"><option>Diésel</option><option>Gasolina</option><option>Híbrido</option><option>Eléctrico</option></select>
        <select id="transmission"><option>Automático</option><option>Manual</option></select>
        
        <input class="form-full" id="phone" placeholder="Teléfono de contacto" value="+34613801086">

        <textarea class="form-full" id="description" placeholder="Descripción" rows="3"></textarea>
        <input class="form-full" type="file" id="photo" accept="image/*">
        
        <button class="btn-primary form-full" id="saveBtn" onclick="saveCar()">Publicar</button>
        <button class="btn-secondary form-full" id="cancelBtn" onclick="cancelEdit()" style="display:none;margin-top:8px;text-align:center;">Cancelar</button>
      </div>
    </div>

    <h2 style="color:var(--gold);margin-bottom:10px;">Vehículos Publicados</h2>
    <div id="cars"></div>
  </div>

  <script>
    const sb = window.supabase.createClient(
      'https://axeolovhcpqcubkachez.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4ZW9sb3ZoY3BxY3Via2FjaGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1OTQ2OTcsImV4cCI6MjExMDE3MDY5N30.ejphVuLjV64Pf84UZ1GB0vdwC98oyWQG2mhiNXo18Yw',
      { auth: { persistSession: true, autoRefreshToken: true } }
    );

    let editingId = null;

    async function init() {
      const { data } = await sb.auth.getSession();
      if (!data.session) location.href = 'panel-control.html';
      else loadCars();
    }

    function statusLabel(s) {
      if (s === 'reserved') return 'Reservado';
      if (s === 'sold') return 'Vendido';
      return 'Disponible';
    }

    async function loadCars() {
      const { data } = await sb.from('vehicles').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('cars');
      if (!data?.length) {
        container.innerHTML = '<p style="color:#888;text-align:center;">No hay coches.</p>';
        return;
      }
      container.innerHTML = data.map(c => `
        <div class="car-item">
          <div class="car-header">
            <div>
              <b>${c.brand} ${c.model}</b>
              <span class="status ${c.status||'available'}">${statusLabel(c.status)}</span>
            </div>
            <div style="color:#aaa;font-size:0.9rem;">${c.year||''} • ${c.price ? Number(c.price).toLocaleString('es-ES')+' €' : ''}</div>
          </div>
          <div class="car-actions">
            <button class="btn-edit" onclick="editCar('${c.id}')">Editar</button>
            <button class="btn-reserve" onclick="setStatus('${c.id}','reserved')">Reservado</button>
            <button class="btn-sold" onclick="setStatus('${c.id}','sold')">Vendido</button>
            <button class="btn-del" onclick="del('${c.id}')">Borrar</button>
          </div>
        </div>
      `).join('');
    }

    async function saveCar() {
      const brand = document.getElementById('brand').value;
      const model = document.getElementById('model').value.trim();
      const price = document.getElementById('price').value;
      if (!brand || !model || !price) return alert('Marca, modelo y precio son obligatorios');

      let image = null;
      const file = document.getElementById('photo').files[0];
      if (file) {
        const name = Date.now() + '_' + file.name.replace(/[^a-z0-9.]/gi, '_');
        const { error } = await sb.storage.from('Vehicles').upload(name, file);
        if (error) return alert('Error foto: ' + error.message);
        image = sb.storage.from('Vehicles').getPublicUrl(name).data.publicUrl;
      }

      const car = {
        title: document.getElementById('title').value.trim() || brand + ' ' + model,
        brand, model,
        year: parseInt(document.getElementById('year').value) || null,
        price: parseFloat(price),
        mileage: parseInt(document.getElementById('km').value) || null,
        fuel: document.getElementById('fuel').value,
        transmission: document.getElementById('transmission').value,
        phone: document.getElementById('phone').value.trim(),
        description: document.getElementById('description').value.trim(),
        status: 'available'
      };
      if (image) car.main_image = image;

      let error;
      if (editingId) {
        ({ error } = await sb.from('vehicles').update(car).eq('id', editingId));
      } else {
        ({ error } = await sb.from('vehicles').insert(car));
      }

      if (error) alert('Error: ' + error.message);
      else {
        alert(editingId ? 'Actualizado' : '¡Publicado!');
        cancelEdit();
        loadCars();
      }
    }

    async function editCar(id) {
      const { data } = await sb.from('vehicles').select('*').eq('id', id).single();
      if (!data) return;
      editingId = id;
      document.getElementById('formTitle').textContent = 'Editar Vehículo';
      document.getElementById('saveBtn').textContent = 'Guardar cambios';
      document.getElementById('cancelBtn').style.display = 'block';
      document.getElementById('title').value = data.title || '';
      document.getElementById('brand').value = data.brand || '';
      document.getElementById('model').value = data.model || '';
      document.getElementById('year').value = data.year || '';
      document.getElementById('price').value = data.price || '';
      document.getElementById('km').value = data.mileage || '';
      document.getElementById('fuel').value = data.fuel || 'Diésel';
      document.getElementById('transmission').value = data.transmission || 'Automático';
      document.getElementById('phone').value = data.phone || '+34613801086';
      document.getElementById('description').value = data.description || '';
      window.scrollTo(0,0);
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('formTitle').textContent = 'Añadir Vehículo';
      document.getElementById('saveBtn').textContent = 'Publicar';
      document.getElementById('cancelBtn').style.display = 'none';
      document.querySelectorAll('input,textarea').forEach(i => {
        if(i.id !== 'phone') i.value = '';
      });
      document.getElementById('brand').value = '';
    }

    async function setStatus(id, status) {
      const { error } = await sb.from('vehicles').update({ status }).eq('id', id);
      if (error) alert(error.message);
      else loadCars();
    }

    async function del(id) {
      if (confirm('¿Borrar este coche?')) {
        await sb.from('vehicles').delete().eq('id', id);
        loadCars();
      }
    }

    async function logout() {
      await sb.auth.signOut();
      location.href = 'panel-control.html';
    }

    init();
  </script>
</body>
</html>
