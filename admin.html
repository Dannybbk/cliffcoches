<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:system-ui;background:#0a0a0a;color:#fff;padding:15px}
    input,select,textarea,button{width:100%;padding:12px;margin:6px 0;background:#222;color:#fff;border:1px solid #444;border-radius:6px}
    button{background:#d4af37;color:#000;font-weight:bold;cursor:pointer}
    .msg{background:#222;padding:10px;margin:10px 0;border-radius:6px;min-height:40px}
  </style>
</head>
<body>
  <h2>Admin CliffCoches</h2>
  <a href="index.html" style="color:#d4af37">← Ver web</a>
  <div class="msg" id="msg">Listo</div>

  <input id="brand" placeholder="Marca">
  <input id="model" placeholder="Modelo">
  <input id="price" type="number" placeholder="Precio">
  <input type="file" id="photo" accept="image/*">
  <button onclick="publish()">PUBLICAR</button>

  <div id="list"></div>

  <script>
    const sb = window.supabase.createClient(
      'https://axeolovhcpqcubkachez.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4ZW9sb3ZoY3BxY3Via2FjaGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1OTQ2OTcsImV4cCI6MjExMDE3MDY5N30.ejphVuLjV64Pf84UZ1GB0vdwC98oyWQG2mhiNXo18Yw'
    );

    function log(t){ document.getElementById('msg').textContent = t; }

    async function publish(){
      try {
        log('Publicando...');
        const brand = document.getElementById('brand').value;
        const model = document.getElementById('model').value;
        const price = document.getElementById('price').value;
        if(!brand || !model || !price) return log('Faltan datos obligatorios');

        let img = null;
        const fileInput = document.getElementById('photo');
        if(fileInput.files && fileInput.files[0]){
          const f = fileInput.files[0];
          log('Subiendo foto...');
          const name = Date.now() + '_' + f.name.replace(/\s+/g, '_');
          
          const { error: e1 } = await sb.storage.from('Vehicles').upload(name, f);
          if(e1) {
            log('Error foto: ' + e1.message);
            return;
          }
          const publicUrlData = sb.storage.from('Vehicles').getPublicUrl(name);
          img = publicUrlData.data.publicUrl;
        }

        log('Guardando coche en BD...');
        const { error: e2 } = await sb.from('vehicles').insert({
          brand, model, price: parseFloat(price), main_image: img, status: 'available', title: brand + ' ' + model
        });
        
        if(e2) {
          log('Error guardar: ' + e2.message);
        } else {
          log('¡PUBLICADO CON ÉXITO!');
          document.getElementById('brand').value = '';
          document.getElementById('model').value = '';
          document.getElementById('price').value = '';
          fileInput.value = '';
          load();
        }
      } catch (err) {
        log('Error inesperado: ' + err.message);
      }
    }

    async function load(){
      const { data, error } = await sb.from('vehicles').select('*').order('created_at', { ascending: false });
      if(error) return log('Error cargar: ' + error.message);
      document.getElementById('list').innerHTML = (data || []).map(c => `<div style="background:#111;padding:10px;margin:5px 0">${c.brand} ${c.model} - ${c.price}€</div>`).join('');
    }

    sb.auth.getSession().then(({ data }) => {
      if(!data.session) {
        location.href = 'login.html';
      } else {
        load();
      }
    });
  </script>
</body>
</html>
