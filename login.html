<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | CliffCoches.Net</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #D4AF37; --black: #0A0A0A; --dark: #141414; --white: #fff; --gray: #888; --red: #ff4d4d; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--black); color: var(--white); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .login-card { background: var(--dark); padding: 30px; border-radius: 12px; border: 1px solid #222; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.8rem; text-align: center; margin-bottom: 25px; }
    h1 span { color: var(--white); }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.9rem; color: var(--gray); margin-bottom: 5px; }
    
    .input-container { position: relative; display: flex; align-items: center; }
    input { width: 100%; padding: 12px 45px 12px 14px; background: #1c1c1c; border: 1px solid #333; color: white; border-radius: 6px; font-size: 0.95rem; outline: none; transition: 0.3s; }
    input:focus { border-color: var(--gold); }
    
    /* Estilo del botón limpio y sin emojis raros */
    .toggle-password { position: absolute; right: 10px; background: transparent; border: none; cursor: pointer; color: var(--gray); font-size: 0.9rem; font-weight: 600; z-index: 99; padding: 5px; }
    .toggle-password:hover { color: var(--gold); }

    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 0.9rem; color: #ccc; cursor: pointer; }
    .checkbox-group input { width: auto; padding: 0; cursor: pointer; accent-color: var(--gold); }

    .btn-primary { width: 100%; background: var(--gold); color: var(--black); border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 1rem; transition: 0.3s; }
    .btn-primary:hover { opacity: 0.9; }
    
    .back-link { display: block; text-align: center; margin-top: 20px; color: var(--gray); font-size: 0.85rem; text-decoration: none; }
    .back-link:hover { color: var(--gold); }
    
    #errorMsg { color: var(--red); font-size: 0.85rem; text-align: center; margin-bottom: 15px; display: none; background: rgba(255,77,77,0.1); padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Cliff<span>Coches</span></h1>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required placeholder="tucorreo@email.com">
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-container">
          <!-- Usamos text con una clase de estilo de enmascaramiento nativo si falla, pero alternando tipos de forma directa -->
          <input type="password" id="password" required placeholder="••••••••">
          <button type="button" class="toggle-password" id="eyeBtn" onclick="togglePasswordVisibility()">Ver</button>
        </div>
      </div>

      <label class="checkbox-group">
        <input type="checkbox" id="rememberMe" checked>
        Mantener sesión iniciada
      </label>

      <div id="errorMsg"></div>
      <button type="submit" class="btn-primary" id="loginBtn">Entrar al Panel</button>
    </form>
    <a href="index.html" class="back-link">← Volver a la página principal</a>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      'https://axeolovhcpqcubkachez.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4ZW9sb3ZoY3BxY3Via2FjaGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1OTQ2OTcsImV4cCI6MjExMDE3MDY5N30.ejphVuLjV64Pf84UZ1GB0vdwC98oyWQG2mhiNXo18Yw',
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeBtn = document.getElementById('eyeBtn');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeBtn.textContent = 'Ocultar';
      } else {
        passwordInput.type = 'password';
        eyeBtn.textContent = 'Ver';
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('loginBtn');
      const errorDiv = document.getElementById('errorMsg');

      btn.textContent = 'Verificando... ⏳';
      btn.disabled = true;
      errorDiv.style.display = 'none';

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        errorDiv.textContent = 'Correo o contraseña incorrectos.';
        errorDiv.style.display = 'block';
        btn.textContent = 'Entrar al Panel';
        btn.disabled = false;
      } else {
        window.location.href = 'admin.html';
      }
    }
  </script>
</body>
</html>
