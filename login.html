<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin | CliffCoches.Net</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #D4AF37; --black: #0A0A0A; --dark: #141414; --white: #fff; --gray: #888; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--black); color: var(--white); display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
    .login-card { background: var(--dark); padding: 30px; border-radius: 12px; border: 1px solid #222; width: 100%; max-width: 400px; text-align: center; }
    h1 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.8rem; margin-bottom: 20px; }
    input { width: 100%; padding: 12px 15px; background: #1c1c1c; border: 1px solid #333; color: white; border-radius: 6px; font-size: 1rem; margin-bottom: 15px; outline: none; }
    input:focus { border-color: var(--gold); }
    .btn-primary { width: 100%; background: var(--gold); color: var(--black); border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 1rem; transition: 0.3s; }
    .btn-primary:hover { opacity: 0.9; }
    .msg { color: var(--gray); font-size: 0.9rem; margin-top: 15px; }
    .back-link { display: block; margin-top: 20px; color: var(--gold); text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>CliffCoches</h1>
    <p style="color:var(--gray); margin-bottom:20px; font-size:0.9rem;">Acceso exclusivo administradores</p>
    
    <input type="email" id="email" placeholder="Correo electrónico">
    <input type="password" id="adminPassword" placeholder="Contraseña">
    <button class="btn-primary" onclick="login()">Entrar al Panel</button>
    
    <p class="msg" id="msg"></p>
    <a href="index.html" class="back-link">← Volver a la página web</a>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      'https://axeolovhcpqcubkachez.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4ZW9sb3ZoY3BxY3Via2FjaGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1OTQ2OTcsImV4cCI2MjExMDE3MDY5N30.ejphVuLjV64Pf84UZ1GB0vdwC98oyWQG2mhiNXo18Yw'
    );

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const msg = document.getElementById('msg');

      if (!email || !password) {
        msg.textContent = 'Introduce correo y contraseña.';
        return;
      }

      msg.textContent = 'Iniciando sesión...';
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        msg.textContent = 'Error: ' + error.message;
      } else {
        msg.textContent = '¡Acceso concedido! Redirigiendo...';
        window.location.href = 'admin.html';
      }
    }

    // Si ya hay sesión activa, mandarle directo a admin.html
    supabase.auth.getSession().then(({ data }) => {
      if (data.session) {
        window.location.href = 'admin.html';
      }
    });
  </script>
</body>
</html>
