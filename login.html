<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | CliffCoches.Net</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --gold: #D4AF37; --black: #0A0A0A; --dark: #141414; --white: #fff; --gray: #888; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--black); color: var(--white); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 420px; background: var(--dark); padding: 35px; border-radius: 12px; border: 1px solid #222; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { text-align: center; margin-bottom: 25px; color: var(--gold); font-size: 1.6rem; font-family: 'Playfair Display', serif; }
    
    .input-group { position: relative; margin-bottom: 15px; }
    input { width: 100%; padding: 14px; background: #1c1c1c; border: 1px solid #333; color: white; border-radius: 8px; font-size: 1rem; outline: none; transition: 0.3s; }
    input:focus { border-color: var(--gold); }
    
    .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--gray); cursor: pointer; font-size: 1.1rem; }
    
    .remember-container { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 0.9rem; color: #ccc; cursor: pointer; }
    .remember-container input { width: 18px; height: 18px; accent-color: var(--gold); cursor: pointer; }

    button.btn-login { width: 100%; padding: 14px; background: var(--gold); color: black; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
    button.btn-login:hover { opacity: 0.9; }
    
    .error { color: #ff6b6b; text-align: center; margin-top: 15px; font-size: 0.9rem; min-height: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CliffCoches Admin</h1>
    
    <div class="input-group">
      <input type="email" id="email" placeholder="Correo electrónico" />
    </div>
    
    <div class="input-group">
      <input type="password" id="password" placeholder="Contraseña" />
      <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
    </div>

    <label class="remember-container">
      <input type="checkbox" id="rememberMe"> Recordar mis datos en este dispositivo
    </label>

    <button class="btn-login" onclick="hacerLogin()">Entrar</button>
    <div id="error" class="error"></div>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      'https://axeolovhcpqcubkachez.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4ZW9sb3ZoY3BxY3Via2FjaGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1OTQ2OTcsImV4cCI6MjExMDE3MDY5N30.ejphVuLjV64Pf84UZ1GB0vdwC98oyWQG2mhiNXo18Yw',
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );

    // Al cargar la página, comprobamos si ya hay sesión abierta o si hay datos guardados
    async function checkExistingSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = 'admin.html';
        return;
      }

      // Rellenar si guardó datos previamente
      const savedEmail = localStorage.getItem('cliff_email');
      const savedPass = localStorage.getItem('cliff_pass');
      if (savedEmail && savedPass) {
        document.getElementById('email').value = savedEmail;
        document.getElementById('password').value = savedPass;
        document.getElementById('rememberMe').checked = true;
      }
    }
    checkExistingSession();

    function togglePassword() {
      const passInput = document.getElementById('password');
      if (passInput.type === 'password') {
        passInput.type = 'text';
      } else {
        passInput.type = 'password';
      }
    }

    async function hacerLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const remember = document.getElementById('rememberMe').checked;
      const errorDiv = document.getElementById('error');

      if (!email || !password) {
        errorDiv.textContent = 'Introduce el email y la contraseña.';
        return;
      }

      errorDiv.textContent = 'Iniciando sesión...';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        errorDiv.textContent = 'Error: ' + error.message;
      } else {
        // Guardar o borrar credenciales según la casilla
        if (remember) {
          localStorage.setItem('cliff_email', email);
          localStorage.setItem('cliff_pass', password);
        } else {
          localStorage.removeItem('cliff_email');
          localStorage.removeItem('cliff_pass');
        }

        errorDiv.textContent = '¡Correcto! Redirigiendo...';
        window.location.href = 'admin.html';
      }
    }
  </script>
</body>
</html>
