<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle | CliffCoches.Net</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #D4AF37; --black: #0A0A0A; --dark: #111; --white: #fff; --gray: #A0A0A0; }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Inter,sans-serif;background:var(--black);color:var(--white);padding:100px 20px 40px;}
    .container{max-width:900px;margin:0 auto;}
    header{position:fixed;top:0;left:0;width:100%;background:rgba(10,10,10,.95);z-index:1000;border-bottom:1px solid #222;padding:15px 20px;}
    .logo{font-family:'Playfair Display',serif;font-size:1.6rem;color:white;text-decoration:none;}
    .logo span{color:var(--gold);}
    
    /* Estilos de la galería de fotos */
    .main-img {width:100%;height:420px;background:#1a1a1a center/cover no-repeat;border-radius:10px;margin-bottom:12px;transition: background-image 0.3s ease;}
    .thumbnails {display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px;}
    .thumb {width:80px;height:60px;background:#1a1a1a center/cover no-repeat;border-radius:6px;cursor:pointer;opacity:0.6;border:1px solid #333;flex-shrink:0;transition: all 0.2s;}
    .thumb:hover, .thumb.active {opacity:1;border-color:var(--gold);}

    h1{font-family:'Playfair Display',serif;font-size:2rem;margin-bottom:10px;}
    .price{color:var(--gold);font-size:2rem;font-weight:700;margin:15px 0;}
    .details{color:var(--gray);margin-bottom:20px;}
    .desc{margin-top:20px;line-height:1.6;color:#ddd;white-space:pre-line;}
    
    /* Botones de contacto discretos tipo Apple */
    .contact-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 25px;
    }
    .btn-discreet {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--white);
      padding: 10px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-discreet:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--gold);
      color: var(--gold);
    }

    @media (max-width: 600px) {
      .main-img { height: 260px; }
      .thumb { width: 60px; height: 45px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">Cliff<span>Coches</span>.Net</a>
  </header>
  <div class="container" id="content">Cargando...</div>

  <script>
    const sb = window.supabase.createClient(
      'https://axeolovhcpqcubkachez.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4ZW9sb3ZoY3BxY3Via2FjaGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1OTQ2OTcsImV4cCI6MjExMDE3MDY5N30.ejphVuLjV64Pf84UZ1GB0vdwC98oyWQG2mhiNXo18Yw'
    );

    function formatPrice(p) {
      if (!p && p !== 0) return 'Consultar';
      let num = String(p).replace(/\./g, '').replace(',', '.');
      num = parseFloat(num);
      if (isNaN(num)) return 'Consultar';
      return num.toLocaleString('es-ES') + ' €';
    }

    async function load() {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) return document.getElementById('content').innerHTML = 'Coche no encontrado';
      const { data, error } = await sb.from('vehicles').select('*').eq('id', id).single();
      if (error || !data) return document.getElementById('content').innerHTML = 'Coche no encontrado';

      const carTitle = data.title || (data.brand + ' ' + data.model);
      const phoneNum = data.phone || '+34613801086';
      const whatsappMsg = encodeURIComponent(`Hola, estoy interesado en el vehículo ${carTitle}`);

      // Recoger imágenes (si hay un campo de galería o varias fotos separadas por comas, o usar main_image)
      let images = [];
      if (data.images) {
        images = typeof data.images === 'string' ? data.images.split(',').map(s => s.trim()) : data.images;
      } else if (data.main_image) {
        images = [data.main_image];
      }

      const mainPhoto = images[0] || '';

      let thumbsHtml = '';
      if (images.length > 1) {
        thumbsHtml = `
          <div class="thumbnails" id="thumbContainer">
            ${images.map((img, index) => `
              <div class="thumb ${index === 0 ? 'active' : ''}" style="background-image:url('${img}')" onclick="changeMainImage('${img}', this)"></div>
            `).join('')}
          </div>
        `;
      }

      document.getElementById('content').innerHTML = `
        <div class="main-img" id="mainDisplayImg" style="background-image:url('${mainPhoto}')"></div>
        ${thumbsHtml}
        <h1>${carTitle}</h1>
        <div class="details">${data.year||''} • ${data.mileage ? Number(data.mileage).toLocaleString('es-ES')+' km' : ''} • ${data.fuel||''} • ${data.transmission||''}</div>
        <div class="price">${formatPrice(data.price)}</div>
        <div class="desc">${data.description || 'Sin descripción.'}</div>
        
        <div class="contact-buttons">
          <a href="tel:${phoneNum}" class="btn-discreet">
            📞 ${phoneNum}
          </a>
          <a href="https://wa.me/${phoneNum.replace(/[^0-9]/g, '')}?text=${whatsappMsg}" target="_blank" class="btn-discreet">
            💬 WhatsApp
          </a>
        </div>
      `;
    }

    function changeMainImage(url, element) {
      document.getElementById('mainDisplayImg').style.backgroundImage = `url('${url}')`;
      document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
      element.classList.add('active');
    }

    load();
  </script>
</body>
</html>
