<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle | CliffCoches.Net</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #D4AF37; --black: #0A0A0A; --dark: #141414; --white: #fff; --gray: #888; --border: #222; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--black); color: var(--white); padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: var(--dark); 
      padding: 16px 24px; 
      border-radius: 12px; 
      border: 1px solid var(--border); 
      margin-bottom: 24px; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    h1 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.5rem; }
    .btn-back { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.85rem; transition: background 0.2s; }
    .btn-back:hover { background: rgba(212,175,55,0.1); }

    .card { 
      background: var(--dark); 
      padding: 24px; 
      border-radius: 16px; 
      border: 1px solid var(--border); 
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    
    .main-img {
      width: 100%;
      height: 420px;
      background: #0A0A0A center/cover no-repeat;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 24px; }
    .thumb { 
      width: 80px; 
      height: 60px; 
      background-size: cover; 
      background-position: center; 
      border-radius: 8px; 
      cursor: pointer; 
      flex-shrink: 0; 
      border: 2px solid transparent; 
      transition: border-color 0.2s;
    }
    .thumb.active { border-color: var(--gold); }

    .car-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--white); margin-bottom: 6px; }
    .car-price { font-size: 1.6rem; font-weight: 700; color: var(--gold); margin-bottom: 20px; }
    
    .specs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .spec-item { background: #1c1c1c; padding: 12px; border-radius: 10px; border: 1px solid #2c2c2c; }
    .spec-label { font-size: 0.75rem; color: var(--gray); text-transform: uppercase; margin-bottom: 4px; }
    .spec-value { font-size: 0.95rem; font-weight: 600; color: var(--white); }

    .description-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--gold); margin-bottom: 8px; }
    .description { color: #ccc; line-height: 1.6; margin-bottom: 24px; white-space: pre-line; font-size: 0.95rem; }

    /* Botones de acción finos y elegantes lado a lado */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-action { 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%; 
      color: white; 
      text-align: center; 
      padding: 11px 14px; 
      border-radius: 8px; 
      text-decoration: none; 
      font-weight: 600; 
      font-size: 0.85rem;
      transition: opacity 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn-whatsapp { background: #25D366; }
    .btn-phone { background: #1c1c1c; border: 1px solid var(--gold); color: var(--gold); }
    .btn-action:hover { opacity: 0.9; }

    @media (max-width: 600px) {
      .main-img { height: 260px; }
      body { padding: 12px; }
      .card { padding: 16px; }
      .action-buttons { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>CliffCoches.Net</h1>
      <a href="index.html" class="btn-back">← Volver</a>
    </header>

    <div class="card" id="content">
      <p style="text-align:center;color:var(--gray);">Cargando vehículo...</p>
    </div>
  </div>

  <script>
    const sb = window.supabase.createClient(
      'https://axeolovhcpqcubkachez.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4ZW9sb3ZoY3BxY3Via2FjaGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1OTQ2OTcsImV4cCI6MjExMDE3MDY5N30.ejphVuLjV64Pf84UZ1GB0vdwC98oyWQG2mhiNXo18Yw'
    );

    async function loadCar() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) {
        document.getElementById('content').innerHTML = '<p>Vehículo no encontrado.</p>';
        return;
      }

      const { data: c, error } = await sb.from('vehicles').select('*').eq('id', id).single();
      if (error || !c) {
        document.getElementById('content').innerHTML = '<p>Vehículo no encontrado.</p>';
        return;
      }

      let imgs = [];
      if (c.images) {
        if (Array.isArray(c.images)) {
          imgs = c.images;
        } else if (typeof c.images === 'string') {
          let clean = c.images.replace(/^\{|\}$/g, '');
          imgs = clean ? clean.split(',').map(s => s.trim().replace(/^"(.*)"$/, '$1')) : [];
        }
      }
      if (imgs.length === 0 && c.main_image) {
        imgs = [c.main_image];
      }

      const mainImgUrl = imgs.length > 0 ? imgs[0] : '';
      const title = c.title || `${c.brand} ${c.model}`;
      const priceFormatted = c.price ? Number(c.price).toLocaleString('es-ES') + ' €' : 'Consultar';
      const phone = c.phone || '+34613801086';
      const cleanPhone = phone.replace(/[^0-9+]/g, '');
      const waMsg = encodeURIComponent(`Hola, estoy interesado en el ${title} (${priceFormatted}) que tenéis en CliffCoches.`);

      document.getElementById('content').innerHTML = `
        <div class="main-img" id="mainImageDisplay" style="background-image: url('${mainImgUrl}')"></div>
        
        <div class="thumbs" id="thumbnailList">
          ${imgs.map((img, idx) => `
            <div class="thumb ${idx === 0 ? 'active' : ''}" 
                 style="background-image: url('${img}')" 
                 onclick="changeImage('${img}', this)">
            </div>
          `).join('')}
        </div>

        <h2 class="car-title">${title}</h2>
        <div class="car-price">${priceFormatted}</div>

        <div class="specs-grid">
          <div class="spec-item">
            <div class="spec-label">Año</div>
            <div class="spec-value">${c.year || 'N/D'}</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Kilómetros</div>
            <div class="spec-value">${c.mileage ? Number(c.mileage).toLocaleString('es-ES') + ' km' : 'N/D'}</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Combustible</div>
            <div class="spec-value">${c.fuel || 'N/D'}</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Transmisión</div>
            <div class="spec-value">${c.transmission || 'N/D'}</div>
          </div>
        </div>

        <div class="description-title">Descripción y Equipamiento</div>
        <div class="description">${c.description || 'Sin descripción adicional.'}</div>

        <div class="action-buttons">
          <a href="https://wa.me/${cleanPhone}?text=${waMsg}" target="_blank" class="btn-action btn-whatsapp">
            💬 WhatsApp
          </a>
          <button class="btn-action btn-phone" onclick="revealPhone(this, '${phone}')">
            📞 Ver Teléfono
          </button>
        </div>
      `;
    }

    function changeImage(url, element) {
      document.getElementById('mainImageDisplay').style.backgroundImage = `url('${url}')`;
      document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
      element.classList.add('active');
    }

    function revealPhone(btn, phoneNum) {
      btn.innerHTML = `📞 <a href="tel:${phoneNum}" style="color:var(--gold);text-decoration:none;font-weight:bold;">${phoneNum}</a>`;
      btn.onclick = null;
    }

    loadCar();
  </script>
</body>
</html>
